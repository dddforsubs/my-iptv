name: ChatGPT Scheduled Task to Google Sheets transport test

on:
  workflow_dispatch:
    inputs:
      csv_url:
        description: Public CSV URL for the Instructions tab
        required: true
        default: https://docs.google.com/spreadsheets/d/e/2PACX-1vS8Dh4EbkkHr69fdhrBTHO3T5-db90GFag1VGfHVgOcuhDSVyLj-2txOcjfSj40_zyHaEUZSTsYqVxB/pub?gid=2043734931&single=true&output=csv
        type: string
      expected_marker:
        description: Marker written by ChatGPT Scheduled Task into column B
        required: true
        default: IPTV-PROBE-20261110-X1
        type: string

permissions:
  contents: read

jobs:
  transport-test:
    name: Verify the Task-written Google Sheets row
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download published CSV and find marker
        env:
          CSV_URL: ${{ inputs.csv_url }}
          EXPECTED_MARKER: ${{ inputs.expected_marker }}
        run: >-
          python scripts/test_sheets_transport.py
          --csv-url "$CSV_URL"
          --expected-marker "$EXPECTED_MARKER"

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheets-transport-probe-${{ github.run_id }}
          path: probe_result.json
          if-no-files-found: error
          retention-days: 14
